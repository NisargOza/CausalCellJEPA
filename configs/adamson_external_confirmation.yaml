  repository: https://github.com/mlbio-epfl/systema
  repository_commit: aaf5b5353993b48b78543f2f93b3e18ca65df515
  equal_condition_perturbed_reference: systematic_reference_only
  bootstrap_resamples: 10000
  primary_metrics: [systema_all_gene_pearson_delta, systema_target_excluded_pearson_delta, centroid_accuracy]
  secondary_metrics: [control_reference_effect_pearson, magnitude_absolute_error, deg_auprc, pathway_nes_pearson]
  report_strata: [all_scored, outcome_fit_seen, outcome_fit_unseen]

decision_rule:
  external_confirmation_requires:
    - paired_bootstrap_95ci_lower_above_zero_vs_perturbed_mean_for_systema_all_gene_pearson_delta
    - paired_bootstrap_95ci_lower_above_zero_vs_perturbed_mean_for_systema_target_excluded_pearson_delta
    - centroid_accuracy_point_estimate_above_perturbed_mean
    - no_more_than_0.01_mean_systema_pearson_loss_vs_best_frozen_component
    - no_more_than_0.02_centroid_accuracy_loss_vs_best_frozen_component
    - no_more_than_2_percent_magnitude_error_degradation_vs_best_frozen_component
  global_state_of_the_art_claim_requires:
    - external_confirmation_passes
    - later_same_split_comparison_beats_perturbed_mean_GEARS_CPA_and_scGPT
    - improvement_is_supported_on_perturbation_specific_and_centroid_metrics
  adamson_alone_supports_global_state_of_the_art_claim: false

terminal_stop_rule:
  architecture_or_threshold_changes_after_adamson_outcomes: forbidden
  full_adamson_evaluations: 1
  if_external_confirmation_fails: stop_architecture_search_and_finalize_mixed_or_negative_result
  if_external_confirmation_passes: run_one_locked_Systema_frontier_comparison_then_finalize
  additional_benchmark_or_tuning_cycles_after_that: forbidden
  project_must_end_with_claim_calibrated_to_evidence: true

