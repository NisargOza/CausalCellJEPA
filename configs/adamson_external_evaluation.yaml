  transcriptomics_config_sha256: db059e44abd9b4a0c6005ecf53c18b92e1c7373fad6beb075ad348eb98a15971
  teacher_path: artifacts/stage1_thunder_f1e5dce/stage1/canonical_ema_teacher.pt
  teacher_bytes: 9825133
