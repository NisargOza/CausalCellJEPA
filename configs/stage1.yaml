# Engineering choices for Stage 1 that are not fixed by RESEARCH_PROPOSAL.md.
# Dataset/split/model defaults remain in configs/replogle.yaml.
seed: 20260823
resource:
  collection: Gene Ontology Biological Process
  release: "2026-08-05"
  ontology_version: "2026-07-26"
  archive_doi: 10.5281/zenodo.21844811
  license: CC-BY-4.0
  license_url: https://creativecommons.org/licenses/by/4.0/
  sources:
    ontology:
      url: https://release.geneontology.org/2026-08-05/ontology/go-basic.obo
      filename: go-basic.obo
      bytes: 32227785
      sha256: b08d45b268b8c24ccb2513dbbbc7d4df9f6521c099b413f79eb31e06e0fa3bcc
    human_annotations:
      url: https://release.geneontology.org/2026-08-05/annotations/gaf/HUMAN-uniprot.gaf.gz
      filename: HUMAN-uniprot.gaf.gz
      bytes: 12109254
      sha256: a0afba19dfb1f8fa996bc1bdcd61fd0c9bd4cf0d2bf2509d09ac86993c0e70a2
  raw_directory: data/resources/go/2026-08-05
  gmt_path: resources/go_bp_2026-08-05_hvg.gmt
  manifest_path: manifests/go_bp_2026-08-05.json
  namespace: biological_process
  taxon: taxon:9606
  ancestor_relations: [is_a, part_of]
  exclude_qualifier: NOT
  include_evidence_codes: all_except_excluded
  excluded_evidence_codes: [ND, RCA]
  excluded_term_subsets: [gocheck_do_not_annotate]
  # Avoid non-informative tiny or extremely broad programs after HVG intersection.
  hvg_program_size: [3, 500]

validation:
  fraction: 0.05
  mask_epoch: -1
  manifest_path: manifests/stage1_v1.json

training:
  batch_size: 32
  epochs: 30
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.05
  warmup_fraction: 0.02
  minimum_learning_rate_fraction: 0.05
  gradient_clip_norm: 1.0
  num_workers: 4
  deterministic_algorithms: true
  checkpoint_every_steps: 1000
  early_stopping_patience: 5
  output_directory: artifacts/stage1
  resume_from: null

cpu_smoke:
  batch_size: 4
  steps: 2
  num_workers: 0
  output_directory: artifacts/stage1_cpu_smoke
