[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "causalcelljepa"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anndata>=0.11",
    "dask[array]>=2024.1",
    "fair-esm==2.0.0",
    "geomloss==0.3.1",
    "h5py>=3.11",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pyarrow>=20.0",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "torch>=2.6",
    "umap-learn>=0.5.7",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
